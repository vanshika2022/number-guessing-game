<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Guessing Game</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, button { margin-top: 10px; padding: 8px; width: 100%; box-sizing: border-box; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Number Guessing Game</h2>
        <button onclick="startGame()">Start New Game</button>
        <p id="gameStatus">Click above to start!</p>

        <div id="gamePlay" style="display: none;">
            <label for="guessInput">Enter a number (1-100):</label>
            <input type="number" id="guessInput" min="1" max="100">
            <button onclick="sendGuess()">Submit Guess</button>
        </div>

        <p id="message"></p>
    </div>

    <script>
        let currentGameId = null;

        async function startGame() {
            const res = await fetch('/games', {
                method: 'POST'
            }); 
            const data = await res.json();
            currentGameId = data.game_id;
            
            document.getElementById('gameStatus').innerText = "Game started! Game ID: " + currentGameId;
            document.getElementById('gamePlay').style.display = 'block';
            document.getElementById('message').innerText = "";
        }

        async function sendGuess() {
            const rawVal = document.getElementById('guessInput').value;
            if (!rawVal) return;
            // Convert string input to an integer
            const guessVal = parseInt(rawVal, 10)

            const res = await fetch('/games/' + currentGameId + '/guesses?guess=' + guessVal, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ guess: guessVal })
});
            
            const data = await res.json();
            if (res.ok) {
                document.getElementById('message').innerText = "Result: " + data.result;
            } else {
                document.getElementById('message').innerText = "Error: " + (data.detail || "Something went wrong");
            }
        }
    </script>
</body>
</html>
